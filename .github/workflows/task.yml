name: Sync upstream fork

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-fork
  cancel-in-progress: false

jobs:
  sync-fork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare upstream sync
        run: |
          git remote add upstream https://github.com/XiaomingX/ai-money-maker-handbook.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the latest upstream commit"
          else
            git merge --no-edit upstream/main
          fi

      - name: Create or update fork sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/sync-upstream
          delete-branch: true
          commit-message: "chore: sync upstream fork"
          title: "Automated upstream sync"
          body: |
            This PR is created by GitHub Actions to sync
            `XiaomingX/ai-money-maker-handbook` into this fork.

      - name: Automatically merge upstream sync PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
