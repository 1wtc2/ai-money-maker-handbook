name: Sync upstream fork

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-fork
  cancel-in-progress: false

jobs:
  sync-fork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # git merge creates a merge commit when upstream has new commits, so configure its identity first.
      - name: Configure merge commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare upstream sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/XiaomingX/ai-money-maker-handbook.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the latest upstream commit"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflict_files" ]]; then
            echo "Upstream merge failed without a resolvable conflict file." >&2
            exit 1
          fi

          # Fork-specific README changes are repository URLs and the online-reader link; keep upstream content and restore these customizations.
          while IFS= read -r path; do
            case "$path" in
              README.md) ;;
              *)
                echo "No automatic conflict rule for: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$conflict_files"

          git checkout --theirs -- README.md
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "https://github.com/XiaomingX/ai-money-maker-handbook",
              "https://github.com/1wtc2/ai-money-maker-handbook",
          )
          reading_link = "> 📖 [打开在线阅读](https://1wtc2.github.io/ai-money-maker-handbook/) · 左侧按章节浏览，右侧阅读正文"
          title = "# 兼职赚钱方案博物馆"
          if reading_link not in text:
              text = text.replace(title, f"{title}\\n\\n{reading_link}", 1)
          path.write_text(text, encoding="utf-8")
          PY
          git add -- README.md
          git commit --no-edit

      - name: Create or update fork sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/sync-upstream
          delete-branch: true
          commit-message: "chore: sync upstream fork"
          title: "Automated upstream sync"
          body: |
            This PR is created by GitHub Actions to sync
            `XiaomingX/ai-money-maker-handbook` into this fork.

      - name: Automatically merge upstream sync PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
