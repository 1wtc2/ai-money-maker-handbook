  if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){fp();cl();fq();var e=i+2;while(e<lines.length&&/^\s*\|.*\|\s*$/.test(lines[e]))e++;var rows=lines.slice(i,e),heads=cells(rows[0]),body=rows.slice(2);out.push('<div class="table-wrap"><table><thead><tr>'+heads.map(function(c){return "<th>"+inline(c,path)+"</th>";}).join("")+"</tr></thead><tbody>"+body.map(function(r){return "<tr>"+cells(r).map(function(c){return "<td>"+inline(c,path)+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table></div>");i=e-1;continue;}
  var h=/^(#{1,6})\s+(.+)$/.exec(line),li=/^\s*([-*+]|\d+[.)])\s+(.+)$/.exec(line);
  if(h){fp();cl();fq();var n=Math.min(h[1].length,4);out.push("<h"+n+">"+inline(h[2],path)+"</h"+n+">");}
  else if(/^\s*>/.test(line)){fp();cl();quote.push(line.replace(/^\s*>\s?/,""));}
  else if(li){fp();fq();var tag=/^\d/.test(li[1])?"ol":"ul";if(list!==tag){cl();list=tag;out.push("<"+tag+">");}out.push("<li>"+inline(li[2],path)+"</li>");}
  else if(/^\s*---+\s*$/.test(line)){fp();cl();fq();out.push("<hr>");}
  else if(line.trim()){cl();fq();p.push(line);}
  else{fp();cl();fq();}
 }
 fp();cl();fq();return out.join("");
}
function renderMarkdown(text,path){text=text.replace(/\r/g,"").replace(/^标题：\s*\n+[^\n]+\n*/,"");return renderBlocks(text.split("\n"),path);}
function renderDirectory(){var q=search.value.trim().toLocaleLowerCase(),list=docs.filter(function(d){return !q||(defaultTitle(d)+" "+d.path).toLocaleLowerCase().indexOf(q)>=0;}),html="";
 folders.forEach(function(f){var all=docs.filter(function(d){return d.folder===f.path;}),visible=list.filter(function(d){return d.folder===f.path;});if(!all.length)return;html+='<details class="group" open><summary>'+esc(f.label)+'<span>'+visible.length+' / '+all.length+'</span></summary><div class="chapter-list">';visible.forEach(function(d){html+='<button class="chapter" type="button" data-path="'+esc(d.path)+'" aria-current="'+(d.path===activePath?"true":"false")+'"><span class="chapter-no">'+String(number(d.path)).padStart(4,"0")+'</span><span class="chapter-name">'+esc(defaultTitle(d))+'</span></button>';});html+="</div></details>";});
 directory.innerHTML=html||'<div class="no-results">没有找到匹配章节。</div>';
}
function currentIndex(){return docs.findIndex(function(d){return d.path===activePath;});}
function controls(){var i=currentIndex(),d=docs[i];prev.disabled=i<=0;next.disabled=i<0||i>=docs.length-1;if(d){crumb.innerHTML="<strong>"+esc(d.folderLabel)+"</strong> / "+esc(defaultTitle(d));source.href="https://github.com/"+OWNER+"/"+REPO+"/blob/"+BRANCH+"/"+encodePath(d.path);}}
async function openDoc(path,pushHash){var d=docs.find(function(x){return x.path===path;});if(!d)return;activePath=path;var id=++requestId;renderDirectory();controls();articleScroll.innerHTML='<div class="status">正在读取章节内容…</div>';if(pushHash)history.pushState(null,"","#doc="+encodeURIComponent(path));document.title=defaultTitle(d)+" · AI 副业赚钱手册";
 try{var r=await fetch(rawUrl(path),{cache:"no-cache"});if(!r.ok)throw new Error("GitHub 返回 "+r.status);var text=await r.text();if(id!==requestId)return;d.title=titleOf(text,path);renderDirectory();controls();articleScroll.innerHTML='<article class="article">'+renderMarkdown(text,path)+'</article>';articleScroll.scrollTop=0;document.title=d.title+" · AI 副业赚钱手册";}
 catch(e){if(id!==requestId)return;articleScroll.innerHTML='<div class="status error">这章暂时无法加载：'+esc(e.message)+'。<br><button class="retry" id="retry">重试</button></div>';document.getElementById("retry").addEventListener("click",function(){openDoc(path,false);});}
}
async function loadDirectory(){directory.innerHTML='<div class="status">正在从 fork 读取章节目录…</div>';
 try{var titleResponse=await fetch("./chapter-index.json",{cache:"no-cache",signal:AbortSignal.timeout(12000)});if(!titleResponse.ok)throw new Error("章节索引读取失败："+titleResponse.status);var titleList=await titleResponse.json();if(!Array.isArray(titleList))throw new Error("章节索引格式不正确");
 docs=titleList.reduce(function(all,x){if(!x||typeof x.path!=="string")return all;var folder=folders.find(function(f){return x.path.indexOf(f.path+"/")===0;});if(!folder||!/^ch[0-9]{4}[.]md$/i.test(x.path.split("/").pop()))return all;all.push({path:x.path,folder:folder.path,folderLabel:folder.label,title:typeof x.title==="string"?x.title:""});return all;},[]);
 docs.sort(function(a,b){var af=folders.findIndex(function(f){return f.path===a.folder;}),bf=folders.findIndex(function(f){return f.path===b.folder;});return af-bf||number(a.path)-number(b.path);});
 totalCount.textContent=docs.length+" 章";renderDirectory();var wanted="";try{wanted=new URLSearchParams(location.hash.slice(1)).get("doc")||"";}catch(e){}if(!docs.some(function(d){return d.path===wanted;}))wanted=(docs.find(function(d){return d.folder===folders[0].path;})||docs[0]||{}).path||"";if(wanted)openDoc(wanted,!location.hash);else directory.innerHTML='<div class="status">仓库中没有找到 Markdown 章节。</div>';
 }catch(e){totalCount.textContent="读取失败";directory.innerHTML='<div class="status error">目录暂时无法读取：'+esc(e.message)+'。<br><button class="retry" id="retry-index">重试</button></div>';document.getElementById("retry-index").addEventListener("click",loadDirectory);}
}
directory.addEventListener("click",function(e){var b=e.target.closest("[data-path]");if(b)openDoc(b.dataset.path,true);});
articleScroll.addEventListener("click",function(e){var a=e.target.closest("[data-doc]");if(a){e.preventDefault();openDoc(a.dataset.doc,true);}});
search.addEventListener("input",renderDirectory);
prev.addEventListener("click",function(){var i=currentIndex();if(i>0)openDoc(docs[i-1].path,true);});
next.addEventListener("click",function(){var i=currentIndex();if(i>=0&&i<docs.length-1)openDoc(docs[i+1].path,true);});
window.addEventListener("hashchange",function(){var p="";try{p=new URLSearchParams(location.hash.slice(1)).get("doc")||"";}catch(e){}if(p&&p!==activePath)openDoc(p,false);});
loadDirectory();
})();
</script>
